[tool.poetry]
name = "mistakr-server"
version = "0.1.0"
description = "Mistakr Backend API Server - Startup Failure Analysis & AI Consulting"
authors = ["aepeul"]
license = "MIT"
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.128.0"
uvicorn = "^0.39.0"
pydantic-settings = "^2.11.0"
sqlalchemy = "^2.0.46"
python-decouple = "^3.8"
alembic = "^1.16.0"
aiosqlite = "^0.22.0"
requests = "^2.32.0"
pyjwt = "^2.11.0"
python-multipart = "^0.0.20"
python-dotenv = "^1.2.0"
anthropic = "^0.79.0"
cryptography = "^46.0.0"
email-validator = "^2.3.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
